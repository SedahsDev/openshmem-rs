[package]
name = "openshmem"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "OpenSHMEM-style partitioned global address space (PGAS) library for Rust, built on pmix-rs (bootstrap) + ucx-rs (RMA/atomics) + ucc-rs (collectives)."
license = "MIT"

[dependencies]
# Pinned to the current heads of the sibling crates:
#   pmix-rs  c5ae064 (github/main)
#   ucx-rs   09b8ec6 (github/master)
pmix = { path = "/home/bzf/projects/pmix-rs-latest" }
ucx-sys = { path = "/home/bzf/projects/ucx-rs-latest" }
ucc = { path = "/home/bzf/projects/ucc-rs", optional = true }

[features]
default = []
# Collectives via UCC. Enable only when a UCC lib is available (none installed here).
collectives = ["dep:ucc"]

[dev-dependencies]
