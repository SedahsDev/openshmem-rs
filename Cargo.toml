[package]
name = "openshmem"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "OpenSHMEM-style PGAS library for Rust"
license = "MIT"

[dependencies]
pmix = { path = "../pmix-rs" }
ucx-sys = { path = "../ucx-rs" }
ucc = { path = "../ucc-rs", optional = true }

[features]
default = []
collectives = ["dep:ucc"]

[dev-dependencies]
