[package]
name = "openshmem"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "OpenSHMEM-style partitioned global address space (PGAS) library for Rust, built on pmix-rs (bootstrap) + ucx-rs (RMA/atomics) + ucc-rs (collectives)."
license = "MIT"

[dependencies]
# Sibling crates pinned to exact revisions so CI does not depend on local checkouts.
pmix = { git = "https://github.com/SedahsDev/pmix-rs.git", rev = "c5ae064a0f4615f1aa1f45bb2e4a8a3e27e9d098" }
ucx-sys = { git = "https://github.com/SedahsDev/ucx-rs.git", rev = "e03af4a8e1c052b7ba1aebcc20177f1acb21cc61" }
ucc = { git = "https://github.com/SedahsDev/ucc-rs.git", rev = "f0f13ed657a418326c242da02e8aec5b7e4b10a0", optional = true }

[features]
default = []
# Collectives via UCC. Enable only when a UCC lib is available (none installed here).
collectives = ["dep:ucc"]

[dev-dependencies]
